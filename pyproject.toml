[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2epub"
version = "0.1.0"
description = "Convert scanned Arabic PDF books into right-to-left, reflowable EPUB3 using an open vision-language model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10",
    "lxml>=5",
    "rapidfuzz>=3.6",
    "regex>=2024.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "click>=8.1",
    "pytesseract>=0.3.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
serve = ["modal>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
pdf2epub = "pdf2epub.cli:main"

[tool.setuptools.packages.find]
include = ["pdf2epub*"]

[tool.setuptools.package-data]
pdf2epub = [
    "data/tanzil/*",
    "ocr/prompts/*",
    "epub/fonts/*",
    "epub/css/*",
    "epub/templates/*",
    "review/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end or external-tool tests (EPUBCheck, Tesseract)",
]
